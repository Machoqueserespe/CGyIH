name: Compilar Release

on:
  workflow_dispatch:
  push:
    branches:
      - practica-1
    paths:
      - main.cpp
      - Practica1.sln
      - Practica1.vcxproj
      - .github/workflows/build-release.yml

permissions:
  contents: write

jobs:
  release:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: practica-1

      - uses: microsoft/setup-msbuild@v2

      - name: Preparar dependencias
        shell: pwsh
        run: vcpkg install glew:x64-windows glfw3:x64-windows

      - name: Compilar solución
        shell: pwsh
        run: |
          $include = "$env:VCPKG_INSTALLATION_ROOT\installed\x64-windows\include"
          $lib = "$env:VCPKG_INSTALLATION_ROOT\installed\x64-windows\lib"
          msbuild Practica1.sln /m /p:Configuration=Release /p:Platform=x64 /p:AdditionalIncludeDirectories="$include" /p:AdditionalLibraryDirectories="$lib"

      - name: Guardar ejecutables de Release
        shell: pwsh
        run: |
          Copy-Item "$env:VCPKG_INSTALLATION_ROOT\installed\x64-windows\bin\glew32.dll" x64/Release/glew32.dll -Force
          git config user.name "Alan Rogelio Barrientos Ramírez"
          git config user.email "Machoqueserespe@users.noreply.github.com"
          git add -f x64/Release/Practica1.exe x64/Release/glew32.dll
          if (-not (git diff --cached --quiet)) {
            git commit -m "Agregar ejecutables de Release"
            git push origin practica-1
          }
