name: Compilar Release

on:
  workflow_dispatch:
  push:
    branches:
      - practica-1
    paths:
      - main.cpp
      - Practica1.sln
      - Practica1.vcxproj
      - .github/workflows/build-release.yml

permissions:
  contents: write

jobs:
  release:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: practica-1

      - uses: microsoft/setup-msbuild@v2

      - name: Preparar dependencias
        shell: pwsh
        run: |
          vcpkg install glew:x64-windows glfw3:x64-windows
          New-Item -ItemType Directory -Force include, lib | Out-Null
          Copy-Item "$env:VCPKG_INSTALLATION_ROOT\installed\x64-windows\include\GL\glew.h" include\glew.h -Force
          Copy-Item "$env:VCPKG_INSTALLATION_ROOT\installed\x64-windows\include\GL\wglew.h" include\wglew.h -Force
          Copy-Item "$env:VCPKG_INSTALLATION_ROOT\installed\x64-windows\include\GLFW\glfw3.h" include\glfw3.h -Force
          Copy-Item "$env:VCPKG_INSTALLATION_ROOT\installed\x64-windows\include\GLFW\glfw3native.h" include\glfw3native.h -Force
          Copy-Item "$env:VCPKG_INSTALLATION_ROOT\installed\x64-windows\lib\glew32.lib" lib\glew32.lib -Force
          Copy-Item "$env:VCPKG_INSTALLATION_ROOT\installed\x64-windows\lib\glfw3dll.lib" lib\glfw3.lib -Force
          Copy-Item "$env:VCPKG_INSTALLATION_ROOT\installed\x64-windows\bin\glew32.dll" glew32.dll -Force

      - name: Compilar solución
        run: msbuild Practica1.sln /m /p:Configuration=Release /p:Platform=x64

      - name: Guardar archivos de Release
        shell: pwsh
        run: |
          git config user.name "Alan Rogelio Barrientos Ramírez"
          git config user.email "Machoqueserespe@users.noreply.github.com"
          git rm --ignore-unmatch x64/Release/glew32.dll x64/Release/glfw3.dll
          git add -f x64/Release/Practica1.exe x64/Release/Practica1.pdb
          if (-not (git diff --cached --quiet)) {
            git commit -m "Corregir archivos de la carpeta Release"
            git push origin practica-1
          }
