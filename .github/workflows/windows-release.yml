name: Compilar Windows Release

on:
  push:
    branches: [practica-3]
    paths:
      - 'Proyecto/**'
      - '.github/workflows/windows-release.yml'

permissions:
  contents: read

jobs:
  release:
    runs-on: windows-2022
    timeout-minutes: 15
    steps:
      - name: Descargar proyecto
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - name: Compilar Release x64
        shell: pwsh
        run: |
          $vswhere = "${env:ProgramFiles(x86)}\Microsoft Visual Studio\Installer\vswhere.exe"
          $msbuild = & $vswhere -latest -products * -requires Microsoft.Component.MSBuild -find 'MSBuild\**\Bin\MSBuild.exe' | Select-Object -First 1
          if (-not $msbuild) { throw 'No se encontro MSBuild.' }
          & $msbuild Proyecto/Practica03.sln /m /t:Rebuild /p:Configuration=Release /p:Platform=x64 /verbosity:minimal /nologo
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          foreach ($file in @('Proyecto/x64/Release/Practica03.exe', 'Proyecto/x64/Release/Practica03.pdb')) {
            if (!(Test-Path $file) -or (Get-Item $file).Length -eq 0) { throw "Falta el archivo $file" }
            Get-FileHash $file -Algorithm SHA256
          }
      - name: Guardar ejecutable y simbolos
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: P03-422022019
          path: |
            Proyecto/x64/Release/Practica03.exe
            Proyecto/x64/Release/Practica03.pdb
          if-no-files-found: error
          retention-days: 14
